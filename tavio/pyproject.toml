[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tavio"
version = "0.1.0"
description = "TAVIO (Timetable Administration & Validation Intelligent Organizer) - Offline-first school timetable and teacher relief management system for Malaysian schools."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "TAVIO Contributors" }
]
dependencies = [
    "PySide6>=6.7.0,<6.9.0",
    "ortools>=9.10.0,<9.12.0",
    "reportlab>=4.2.0,<5.0.0",
    "openpyxl>=3.1.2,<4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0.0",
    "ruff>=0.6.0,<1.0.0",
    "pyinstaller>=6.10.0,<7.0.0",
]

[project.gui-scripts]
tavio = "tavio.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
